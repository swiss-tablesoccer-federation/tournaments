<!DOCTYPE html>
<html lang="de" class="page-news page-documents">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Swiss Tablesoccer Federation - News</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
  <link rel="stylesheet" href="../assets/css/main.css" />
</head>
<body>

<nav class="site-nav">
  <div class="site-nav-inner">
    <a href="https://swisstablesoccer.ch" class="site-nav-logo" aria-label="Swiss Tablesoccer Federation - Home">
      <img src="https://github.com/user-attachments/assets/6df8525e-7665-4ab6-8c5a-407ddf00bc91"
           alt="Swiss Tablesoccer Federation" />
    </a>
    <button class="nav-hamburger" id="navHamburger" aria-label="Toggle navigation" aria-expanded="false">
      <i class="fa-solid fa-bars"></i>
    </button>
    <div class="site-nav-links">
      <a href="/" class="nav-link-item active" data-i18n="navNews">News</a>
      <a href="/tournaments/" class="nav-link-item" data-i18n="navTournaments">Tournament Calendar</a>
      <a href="/rankings" class="nav-link-item" data-i18n="navRankings">Rankings</a>
      <a href="#" class="nav-link-item" data-i18n="navCompetitions">Competitions</a>
      <a href="#" class="nav-link-item" data-i18n="navFederation">Federation</a>
    </div>
    <div class="lang-selector" id="langSelector" aria-label="Language">
      <button class="lang-btn active" data-lang="de">DE</button>
      <button class="lang-btn" data-lang="fr">FR</button>
      <button class="lang-btn" data-lang="it">IT</button>
      <button class="lang-btn" data-lang="en">EN</button>
    </div>
  </div>
</nav>

<div class="container-fluid py-4 page-content">
  <div class="documents-header mb-3 news-toolbar">
    <span class="documents-count" id="newsCount"></span>
    <input type="search" id="newsSearch" class="news-search" data-i18n-placeholder="newsSearchPlaceholder" placeholder="News durchsuchen..." autocomplete="off" />
  </div>

  <div class="documents-card">
    <div class="documents-layout">
      <div class="documents-browser">
        <div id="newsList"></div>
      </div>

      <div class="document-viewer-card" aria-live="polite">
        <div class="document-viewer-header">
          <div class="document-viewer-heading">
            <div class="document-viewer-label" id="newsViewerLabel" data-i18n="newsViewerLabel">News</div>
            <h2 class="document-viewer-title" id="newsTitle">-</h2>
            <div class="news-viewer-meta" id="newsMeta"></div>
          </div>
        </div>
        <div class="document-viewer-status is-empty" id="newsStatus" data-i18n="newsSelectPrompt">Wähle einen Beitrag aus.</div>
        <div class="document-viewer-content document-markdown" id="newsContent"></div>
      </div>
    </div>
  </div>

  <div class="page-footer mt-3">
    <div class="page-footer-left">
      <span><span data-i18n="dataProvidedBy">Data provided by</span> <a href="https://www.swisstablesoccer.ch/home" target="_blank" rel="noopener">swisstablesoccer.ch</a></span>
    </div>
    <div class="page-footer-right" aria-label="Social links">
      <a class="footer-social-btn" href="https://www.instagram.com/swisstablesoccer/" target="_blank" rel="noopener" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
      <a class="footer-social-btn" href="https://www.youtube.com/@SwissTablesoccerFederation" target="_blank" rel="noopener" aria-label="YouTube"><i class="fa-brands fa-youtube"></i></a>
      <a class="footer-social-btn" href="https://www.facebook.com/swisstablesoccer" target="_blank" rel="noopener" aria-label="Facebook"><i class="fa-brands fa-facebook"></i></a>
      <a class="footer-social-btn" href="mailto:info@swisstablesoccer.ch" aria-label="Email"><i class="fa-solid fa-envelope"></i></a>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"
        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
        crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"
        integrity="sha384-948ahk4ZmxYVYOc+rxN1H2gM1EJ2Duhp7uHtZ4WSLkV4Vtx5MUqnV+l7u9B+jFv+"
        crossorigin="anonymous"></script>

<script src="../assets/js/nav-config.js"></script>
<script src="../assets/js/i18n.js"></script>
<script src="news.js"></script>
</body>
</html>
